# ==============================================================================
# Sologix Energy - Nginx Reverse Proxy & SSL Configuration
# Location on VM: /etc/nginx/sites-available/sologix-attendance.conf
# ==============================================================================

# HTTP - Redirect all traffic to HTTPS (managed by Certbot in production)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Client upload limit for selfies (max 10MB)
    client_max_body_size 10M;

    # Certbot ACME challenge validation path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Proxy to Node backend when running over HTTP / IP prior to SSL setup
    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

