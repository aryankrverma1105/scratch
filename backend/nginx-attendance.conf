# Nginx Reverse Proxy Configuration for Attendance Backend API on GCP VM
# Save to: /etc/nginx/sites-available/attendance
# Symlink: sudo ln -s /etc/nginx/sites-available/attendance /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name 34.180.17.0 localhost;

    # Allow large payloads for selfie photo uploads
    client_max_body_size 20M;

    # API Endpoints reverse proxy to Node.js backend (including authenticated /api/files/)
    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }
}
