services:
  attendance-backend:
    build: .
    container_name: attendance-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=super_secret_attendance_jwt_key_2026_change_in_production
      - JWT_EXPIRES_IN=30d
      - ADMIN_DEFAULT_EMAIL=admin@company.com
      - ADMIN_DEFAULT_PASSWORD=admin123
      - ADMIN_DEFAULT_NAME=System Administrator
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
