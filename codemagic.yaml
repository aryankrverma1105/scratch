workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    working_directory: attendance_app
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Build iOS Application
        script: |
          flutter build ios --release --no-codesign
      - name: Package into IPA
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r SologixAttendance_iOS.ipa Payload
    artifacts:
      - attendance_app/build/ios/iphoneos/*.ipa
    publishing:
      email:
        recipients:
          - aryankrverma1105@gmail.com
        notify:
          success: true
          failure: true
